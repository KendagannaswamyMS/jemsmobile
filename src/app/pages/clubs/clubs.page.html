<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Clubs</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- ── Loading ──────────────────────────────────── -->
  <div *ngIf="loading" class="skeleton-list">
    <div class="club-skeleton" *ngFor="let s of [1,2,3]">
      <ion-skeleton-text animated class="skel-logo"></ion-skeleton-text>
      <div class="skel-body">
        <ion-skeleton-text animated style="width:60%;height:13px;border-radius:4px"></ion-skeleton-text>
        <ion-skeleton-text animated style="width:90%;height:10px;border-radius:4px;margin-top:6px"></ion-skeleton-text>
      </div>
    </div>
  </div>

  <!-- ── Empty ─────────────────────────────────────── -->
  <div class="empty-state" *ngIf="!loading && clubs.length === 0">
    <ion-icon name="people-outline"></ion-icon>
    <p>No clubs available yet</p>
  </div>

  <!-- ── Club List ─────────────────────────────────── -->
  <div class="club-list" *ngIf="!loading && clubs.length > 0">
    <div class="club-item" *ngFor="let c of clubs">
      <div class="club-item-logo">
        <img *ngIf="c.logopath" [src]="c.logopath" (error)="c.logopath = ''" alt="" />
        <ion-icon *ngIf="!c.logopath" name="people-outline"></ion-icon>
      </div>
      <div class="club-item-body">
        <div class="club-item-head">
          <h3>{{ c.clubname }}</h3>
          <span class="club-count" *ngIf="c.memberCount !== undefined && c.memberCount !== null">
            <ion-icon name="person-outline"></ion-icon>{{ c.memberCount }}
          </span>
        </div>
        <p class="club-desc" *ngIf="c.description">
          {{ c.description.length > 100 ? (c.description.slice(0,100) + '…') : c.description }}
        </p>
        <div class="club-coords" *ngIf="c.facultyCoordinatorName || c.studentCoordinatorName">
          <span *ngIf="c.facultyCoordinatorName">
            <ion-icon name="school-outline"></ion-icon>{{ c.facultyCoordinatorName }}
          </span>
          <span *ngIf="c.studentCoordinatorName">
            <ion-icon name="person-circle-outline"></ion-icon>{{ c.studentCoordinatorName }}
          </span>
        </div>
        <div class="club-actions">
          <span class="status-badge status-member" *ngIf="memberStatus(c.clubslnum) === 'member'">
            <ion-icon name="checkmark-circle-outline"></ion-icon>Member
          </span>
          <span class="status-badge status-pending" *ngIf="memberStatus(c.clubslnum) === 'pending'">
            <ion-icon name="hourglass-outline"></ion-icon>Pending
          </span>
          <button class="join-btn" *ngIf="memberStatus(c.clubslnum) === 'none'" (click)="requestJoin(c.clubslnum)">
            <ion-icon name="person-add-outline"></ion-icon>Join
          </button>
        </div>
      </div>
    </div>
  </div>

</ion-content>
